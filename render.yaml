# Render Blueprint for Going Twice: one web service (in-memory state, so keep ONE instance) plus a
# Render Workflow service that runs auction settlement (see docs/WORKFLOWS.md).
# Secrets are sync:false: set them in the Render dashboard. NEXT_PUBLIC_* is inlined at build
# time, so set it before the first deploy.
services:
  - type: web
    name: going-twice
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start # next start listens on $PORT (Render sets it)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PERSIST
        value: "1" # write-behind JSON in .data/ (ephemeral disk; survives restarts, not redeploys)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: TREASURER_PAYPAL_EMAIL
        sync: false
      - key: SANDBOX_BUYER_EMAILS # sandbox test-account emails only (no passwords); receipts + default estate consignors
        value: sb-pffz953856754@personal.example.com,sb-wblr653856755@personal.example.com,sb-gv1q453856779@personal.example.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS # optional extra free keys, comma-separated, rotated on 429
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FAST_MODEL # short auctioneer lines (default gemini-2.5-flash-lite)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      # GT_TEST_HOOKS must stay unset here: it enables fault injection for scripts/break-tests.mjs only.
      - key: DEMO_MODE
        sync: false
      # Render Workflows (optional). "0" = settle in-process. Set to "1" only after the workflow service
      # below has PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET; if a run cannot settle, the close falls back in-process.
      - key: RENDER_WORKFLOWS
        value: "0"
      - key: RENDER_WORKFLOW_SLUG
        value: going-twice-settlement # = the workflow service name below
      - key: RENDER_API_KEY # Account Settings > API Keys
        sync: false

  # Settlement tasks: captureWinner / voidHold / sendPayout / issueReceipt, orchestrated by settleAuction.
  # Workflows take per-task compute plans in code (workflows/tasks.ts), so there is no `plan` here.
  - type: workflow
    name: going-twice-settlement
    runtime: node
    region: oregon # required for workflows; keep it equal to the web service's region
    buildCommand: npm ci
    startCommand: npx tsx workflows/index.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
